<script>
// Helper: Parse CSV text into array of objects
function parseCSV(csv, delimiter = ',') {
    const lines = csv.split(/\r?\n/).filter(line => line.trim().length > 0);
    const headers = lines[0].split(delimiter).map(h => h.replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
        const values = [];
        let inQuotes = false, value = '', i = 0;
        while (i < line.length) {
            const char = line[i];
            if (char === '"') {
                if (inQuotes && line[i + 1] === '"') {
                    value += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === delimiter && !inQuotes) {
                values.push(value);
                value = '';
            } else {
                value += char;
            }
            i++;
        }
        values.push(value);
        const obj = {};
        headers.forEach((h, idx) => obj[h] = values[idx] !== undefined ? values[idx] : '');
        return obj;
    });
}

// Load airports.csv and build ICAO code to name map
let icaoToName = {};
fetch('assets/airports_europe_clean.csv')
    .then(resp => resp.text())
    .then(csv => {
        const airports = parseCSV(csv);
        // ICAO code is in 'ident' or 'icao_code' or 'gps_code' (use 'ident' for most cases)
        airports.forEach(ap => {
            // Only include airports in Europe (continent == 'EU')
            if (ap.continent && ap.continent.toUpperCase() === 'EU' && ap.name) {
                const codes = [ap.ident, ap.icao_code, ap.gps_code].map(x => (x||'').toUpperCase());
                codes.forEach(code => {
                    if (code) {
                        icaoToName[code] = ap.name;
                    }
                });
            }
        });
        window.airportLookupReady = true;
        renderMovementsLog();
    })
    .catch(() => {
        // If CSV fails to load, fallback to ICAO codes
        renderMovementsLog();
    });

// Render movements log into the table, replacing ICAO codes with airport names
let logSortKey = 'timestamp';
let logSortAsc = true;
let logFilter = '';
function renderMovementsLog() {
    console.log('FETCHING BOOKINGS...');
    fetch(`${SKYCOMMAND_API_BASE}/api/flight-bookings`)
      .then(resp => resp.json())
      .then(bookings => {
        console.log('BOOKINGS FROM API', bookings);
        if (!bookings || !Array.isArray(bookings) || bookings.length === 0) {
          bookings = [];
        }
        const denied = bookings.filter(b => b.status === 'denied');
        console.log('DENIED BOOKINGS', denied);
                // Render denied bookings section
                const deniedContainer = document.getElementById('denied-bookings');
                if (deniedContainer) {
                    if (denied.length > 0) {
                        deniedContainer.style.display = '';
                        deniedContainer.innerHTML = '<span style="font-size:1.1em;">Denied Bookings:</span><br>';
                        denied.forEach((b, idx) => {
                            const entryBox = document.createElement('div');
                            entryBox.style.margin = '8px 0';
                            entryBox.style.padding = '8px';
                            entryBox.style.background = '#fff0f0';
                            entryBox.style.border = '1px solid #d32f2f';
                            // Render as a single-row table matching the movements log columns
                            const table = document.createElement('table');
                            table.style.width = '100%';
                            table.style.background = '#fff';
                            table.style.marginBottom = '4px';
                            table.style.borderCollapse = 'collapse';
                            table.style.tableLayout = 'fixed';
                            const thead = document.createElement('thead');
                            const headRow = document.createElement('tr');
                            [
                                'Registration', 'Callsign', 'Type', 'TO', 'ATD', 'ATA', 'FROM', 'Name', 'POB'
                            ].forEach(label => {
                                const th = document.createElement('th');
                                th.textContent = label;
                                th.style.background = '#ffeaea';
                                th.style.color = '#b71c1c';
                                th.style.fontWeight = 'bold';
                                th.style.padding = '4px 6px';
                                th.style.border = '1px solid #ffd6d6';
                                th.style.textAlign = 'left';
                                headRow.appendChild(th);
                            });
                            thead.appendChild(headRow);
                            table.appendChild(thead);
                            const tbody = document.createElement('tbody');
                            const row = document.createElement('tr');
                            [
                                b.aircraftId || b.reg || '',
                                b.callsign || '',
                                b.type || '',
                                b.to || '',
                                b.atd || '',
                                b.ata || '',
                                b.from || '',
                                b.name || '',
                                b.pob || ''
                            ].forEach(val => {
                                const td = document.createElement('td');
                                td.textContent = val;
                                td.style.padding = '4px 6px';
                                td.style.border = '1px solid #ffd6d6';
                                td.style.background = '#fff';
                                td.style.color = '#b71c1c';
                                row.appendChild(td);
                            });
                            tbody.appendChild(row);
                            table.appendChild(tbody);
                            entryBox.appendChild(table);

                            const actions = document.createElement('div');
                            actions.style.marginTop = '4px';

                            const reapproveBtn = document.createElement('button');
                            reapproveBtn.textContent = 'Reapprove';
                            reapproveBtn.style.marginRight = '6px';
                            reapproveBtn.onclick = async () => {
                                if (!b.id) return alert('No booking ID');
                                reapproveBtn.disabled = true;
                                reapproveBtn.textContent = 'Reapproving...';
                                try {
                                    const resp = await fetch(`${SKYCOMMAND_API_BASE}/api/flight-bookings/${b.id}/status`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ status: 'approved' })
                                    });
                                    const result = await resp.json();
                                    if (resp.ok) {
                                        alert('Booking reapproved!');
                                        renderMovementsLog();
                                    } else {
                                        alert('Error: ' + (result.error || 'Unknown error'));
                                    }
                                } catch (err) {
                                    alert('Request failed: ' + err);
                                } finally {
                                    reapproveBtn.disabled = false;
                                    reapproveBtn.textContent = 'Reapprove';
                                }
                            };

                            const editBtn = document.createElement('button');
                            editBtn.textContent = 'Edit';
                            editBtn.style.marginRight = '6px';
                            editBtn.onclick = () => alert('Edit not implemented');

                            const deleteBtn = document.createElement('button');
                            deleteBtn.textContent = 'Delete';
                            deleteBtn.onclick = () => alert('Delete not implemented');

                            actions.appendChild(reapproveBtn);
                            actions.appendChild(editBtn);
                            actions.appendChild(deleteBtn);
                            entryBox.appendChild(actions);
                            deniedContainer.appendChild(entryBox);
                        });
                    } else {
                        deniedContainer.style.display = 'none';
                        deniedContainer.innerHTML = '';
                    }
                }
        // ...existing rendering logic below, replace 'log' with 'bookings'...
        // Sort
        bookings.sort((a, b) => {
          let ka = (a[logSortKey]||'').toUpperCase ? (a[logSortKey]||'').toUpperCase() : (a[logSortKey]||'');
          let kb = (b[logSortKey]||'').toUpperCase ? (b[logSortKey]||'').toUpperCase() : (b[logSortKey]||'');
          if (logSortKey === 'atd' || logSortKey === 'ata') {
              return logSortAsc ? ka.localeCompare(kb) : kb.localeCompare(ka);
          }
          if (ka < kb) return logSortAsc ? -1 : 1;
          if (ka > kb) return logSortAsc ? 1 : -1;
          return 0;
        });
        const tbody = document.getElementById('movementsLogBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        bookings.forEach((entry, idx) => {
          // ...existing row rendering logic, unchanged...
          let toDisplay = entry.to || '';
          let fromDisplay = entry.from || '';
          function lookupName(val) {
              if (!val) return '';
              let code = val.trim().toUpperCase();
              if (code.includes('-')) {
                  return code.split('-').map(part => icaoToName[part] || part).join(' - ');
              }
              return icaoToName[code] || code;
          }
          // Debug: Show what is being looked up
          console.log('Entry:', entry);
          console.log('Looking up TO:', toDisplay, 'Result:', lookupName(toDisplay));
          console.log('Looking up FROM:', fromDisplay, 'Result:', lookupName(fromDisplay));
          toDisplay = lookupName(toDisplay);
          fromDisplay = lookupName(fromDisplay);
          if ((entry.colorClass||'').toUpperCase() === 'LANDAWAY') {
              let toVal = (entry.to||'').replace(/\s+/g, '').toUpperCase();
              const depAirfield = 'EGSX';
              if (toVal.startsWith(depAirfield + '-')) {
                  let dest = toVal.substring(depAirfield.length + 1);
                  toDisplay = icaoToName[dest] || dest;
              } else if (toVal === depAirfield) {
                  toDisplay = '';
              } else {
                  toDisplay = icaoToName[toVal] || toVal;
              }
              fromDisplay = '';
          } else if ((entry.colorClass||'').toUpperCase() === 'OVERFLIGHT' || (entry.colorClass||'').toUpperCase() === 'TRANSIT') {
              let toVal = (entry.to||'').replace(/\s+/g, '').toUpperCase();
              let fromVal = (entry.from||'').replace(/\s+/g, '').toUpperCase();
              if (/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(toVal)) {
                  let parts = toVal.split('-');
                  toDisplay = icaoToName[parts[1]] || parts[1];
              } else {
                  toDisplay = icaoToName[toVal] || toVal;
              }
              if (fromVal === 'EGSX') fromDisplay = '';
              else if (icaoToName[fromDisplay.toUpperCase()]) fromDisplay = icaoToName[fromDisplay.toUpperCase()];
          } else {
              let toVal = (entry.to||'').replace(/\s+/g, '').toUpperCase();
              if (/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(toVal)) {
                  let [a, b] = toVal.split('-');
                  if (a === b) {
                      toDisplay = a;
                  } else {
                      if (icaoToName[toDisplay.toUpperCase()]) toDisplay = icaoToName[toDisplay.toUpperCase()];
                  }
              } else {
                  if (icaoToName[toDisplay.toUpperCase()]) toDisplay = icaoToName[toDisplay.toUpperCase()];
              }
              if (icaoToName[fromDisplay.toUpperCase()]) fromDisplay = icaoToName[fromDisplay.toUpperCase()];
              if ((entry.from||'').toUpperCase() === 'EGSX') fromDisplay = '';
              if ((entry.colorClass||'').toUpperCase() === 'ARRIVAL') toDisplay = '';
          }
          const tr = document.createElement('tr');
          tr.innerHTML = `
              <td contenteditable="true" data-key="reg">${(entry.reg || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="callsign">${(entry.callsign || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="type">${(entry.type || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="to">${(toDisplay || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="atd">${(entry.atd || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="ata">${(entry.ata || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="from">${(fromDisplay || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="name">${(entry.name || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
              <td contenteditable="true" data-key="pob">${(entry.pob || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
          `;
          if (entry.colorClass) tr.classList.add(entry.colorClass);
          tr.querySelectorAll('[contenteditable]').forEach(cell => {
              cell.addEventListener('blur', function() {
                  let newVal = this.innerText.replace(/\s+/g, ' ').replace(/\n/g, '').trim();
                  let key = this.getAttribute('data-key');
                  entry[key] = newVal;
                  // No localStorage update for API data
                  this.innerText = newVal;
              });
              cell.addEventListener('keydown', function(e) {
                  if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
              });
              cell.addEventListener('paste', function(e) {
                  e.preventDefault();
                  let text = (e.clipboardData || window.clipboardData).getData('text');
                  text = text.replace(/\s+/g, ' ').replace(/\n/g, '');
                  document.execCommand('insertText', false, text);
              });
          });
          tbody.appendChild(tr);
        });
      });
        // Filter by movement type
        if (logFilter) {
            const filter = logFilter.toUpperCase();
            if (filter === 'DEPARTURES') {
                log = log.filter(entry => (entry.colorClass||'').toUpperCase() === 'LANDAWAY');
            } else if (filter === 'ARRIVALS') {
                log = log.filter(entry => (entry.colorClass||'').toUpperCase() === 'ARRIVAL');
            } else if (filter === 'LOCAL') {
                log = log.filter(entry => (entry.colorClass||'').toUpperCase() === 'LOCAL');
            } else if (filter === 'CIRCUITS') {
                log = log.filter(entry => (entry.colorClass||'').toUpperCase() === 'CIRCUIT');
            }
        }
    // Sort
    log.sort((a, b) => {
        let ka = (a[logSortKey]||'').toUpperCase ? (a[logSortKey]||'').toUpperCase() : (a[logSortKey]||'');
        let kb = (b[logSortKey]||'').toUpperCase ? (b[logSortKey]||'').toUpperCase() : (b[logSortKey]||'');
        if (logSortKey === 'atd' || logSortKey === 'ata') {
            // Sort times as HH:MM
            return logSortAsc ? ka.localeCompare(kb) : kb.localeCompare(ka);
        }
        if (ka < kb) return logSortAsc ? -1 : 1;
        if (ka > kb) return logSortAsc ? 1 : -1;
        return 0;
    });
    const tbody = document.getElementById('movementsLogBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    log.forEach((entry, idx) => {
        // Replace ICAO code with airport name if possible, and suppress EGSX as required
        let toDisplay = entry.to || '';
        let fromDisplay = entry.from || '';
        // Enhanced lookup: split on '-' and show names if found
        function lookupName(val) {
            if (!val) return '';
            let code = val.trim().toUpperCase();
            if (code.includes('-')) {
                return code.split('-').map(part => icaoToName[part] || part).join(' - ');
            }
            return icaoToName[code] || code;
        }
        // Debug: Show what is being looked up
        console.log('Entry:', entry);
        console.log('Looking up TO:', toDisplay, 'Result:', lookupName(toDisplay));
        console.log('Looking up FROM:', fromDisplay, 'Result:', lookupName(fromDisplay));

        // Use enhanced lookup for display
        toDisplay = lookupName(toDisplay);
        fromDisplay = lookupName(fromDisplay);
        // For departures (landaway):
        // - If 'to' is in the form 'EGTR-XXXX', only show XXXX (the destination code, not airport name)
        // - If 'to' is just 'EGTR', show blank
        // - Suppress 'from' field
        if ((entry.colorClass||'').toUpperCase() === 'LANDAWAY') {
            // Always suppress EGSX in 'To' for Landaway
            let toVal = (entry.to||'').replace(/\s+/g, '').toUpperCase();
            const depAirfield = 'EGSX';
            if (toVal.startsWith(depAirfield + '-')) {
                let dest = toVal.substring(depAirfield.length + 1); // everything after 'EGSX-'
                toDisplay = icaoToName[dest] || dest;
            } else if (toVal === depAirfield) {
                toDisplay = '';
            } else {
                // If 'to' is just a destination code, show it (as name if available)
                toDisplay = icaoToName[toVal] || toVal;
            }
            fromDisplay = '';
        } else if ((entry.colorClass||'').toUpperCase() === 'OVERFLIGHT' || (entry.colorClass||'').toUpperCase() === 'TRANSIT') {
            // For overflight/transit, if 'to' is in the form 'FROM-TO', only show TO in 'To' column
            let toVal = (entry.to||'').replace(/\s+/g, '').toUpperCase();
            let fromVal = (entry.from||'').replace(/\s+/g, '').toUpperCase();
            if (/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(toVal)) {
                let parts = toVal.split('-');
                toDisplay = icaoToName[parts[1]] || parts[1];
            } else {
                toDisplay = icaoToName[toVal] || toVal;
            }
            if (fromVal === 'EGSX') fromDisplay = '';
            else if (icaoToName[fromDisplay.toUpperCase()]) fromDisplay = icaoToName[fromDisplay.toUpperCase()];
        } else {
            // For local/overflight/circuit: if 'to' is 'XXXX-XXXX' and both are the same, show only 'XXXX'
            let toVal = (entry.to||'').replace(/\s+/g, '').toUpperCase();
            if (/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(toVal)) {
                let [a, b] = toVal.split('-');
                if (a === b) {
                    toDisplay = a;
                } else {
                    if (icaoToName[toDisplay.toUpperCase()]) toDisplay = icaoToName[toDisplay.toUpperCase()];
                }
            } else {
                if (icaoToName[toDisplay.toUpperCase()]) toDisplay = icaoToName[toDisplay.toUpperCase()];
            }
            if (icaoToName[fromDisplay.toUpperCase()]) fromDisplay = icaoToName[fromDisplay.toUpperCase()];
            // Suppress EGSX in 'from' for all rows
            if ((entry.from||'').toUpperCase() === 'EGSX') fromDisplay = '';
            // Suppress 'to' for arrivals (from line)
            if ((entry.colorClass||'').toUpperCase() === 'ARRIVAL') toDisplay = '';
        }
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td contenteditable="true" data-key="reg">${(entry.reg || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="callsign">${(entry.callsign || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="type">${(entry.type || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="to">${(toDisplay || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="atd">${(entry.atd || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="ata">${(entry.ata || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="from">${(fromDisplay || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="name">${(entry.name || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
            <td contenteditable="true" data-key="pob">${(entry.pob || '').replace(/\s+/g, ' ').replace(/\n/g, '')}</td>
        `;
        if (entry.colorClass) tr.classList.add(entry.colorClass);
        // Save on blur and prevent line breaks
        tr.querySelectorAll('[contenteditable]').forEach(cell => {
            cell.addEventListener('blur', function() {
                let newVal = this.innerText.replace(/\s+/g, ' ').replace(/\n/g, '').trim();
                let key = this.getAttribute('data-key');
                entry[key] = newVal;
                let logAll = JSON.parse(localStorage.getItem('movementsLog') || '[]');
                logAll[idx][key] = newVal;
                localStorage.setItem('movementsLog', JSON.stringify(logAll));
                this.innerText = newVal;
            });
            cell.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
            });
            cell.addEventListener('paste', function(e) {
                e.preventDefault();
                let text = (e.clipboardData || window.clipboardData).getData('text');
                text = text.replace(/\s+/g, ' ').replace(/\n/g, '');
                document.execCommand('insertText', false, text);
            });
        });
        tbody.appendChild(tr);
    });
}

    document.getElementById('showOnlyDropdown').addEventListener('change', function() {

// --- AIRLINE LOOKUP ---
let trigraphToCallsign = {};
let callsignToTrigraph = {};
fetch('assets/data/airlines.dat.txt')
    .then(resp => resp.text())
    .then(txt => {
        // Use robust CSV parser for airline data
        const lines = txt.split(/\r?\n/).filter(line => line.trim().length > 0 && !line.startsWith('#'));
        const airlineRows = lines.map(line => {
            const values = [];
            let inQuotes = false, value = '', i = 0;
            while (i < line.length) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        value += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    values.push(value);
                    value = '';
                } else {
                    value += char;
                }
                i++;
            }
            values.push(value);
            return values;
        });
        airlineRows.forEach(parts => {
            if (parts.length < 7) return;
            let icao = parts[4]?.replace(/(^"|"$)/g, '');
            let callsign = parts[5]?.replace(/(^"|"$)/g, '');
            if (icao && callsign) {
                trigraphToCallsign[icao.toUpperCase()] = callsign;
                callsignToTrigraph[callsign.toUpperCase()] = icao;
            }
        });
    });

// --- AIRCRAFT REGISTRATION LOOKUP (LOAD ON PAGE LOAD) ---
let regToType = {};
let aircraftDbLoaded = false;
let regToTypeWeight = {};
function loadAircraftDb(primary, fallback) {
    fetch(primary)
        .then(resp => {
            if (!resp.ok) throw new Error('Primary not found');
            return resp.text();
        })
        .then(parseAircraftDb)
        .catch(() => {
            if (fallback) {
                fetch(fallback)
                    .then(resp => resp.text())
                    .then(parseAircraftDb)
                    .catch(() => {
                        aircraftDbLoaded = 'error';
                    });
            } else {
                aircraftDbLoaded = 'error';
            }
        });
}
function parseAircraftDb(txt) {
    txt.split(/\r?\n/).forEach(line => {
        let parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
            // Always use first field as reg, second as type, third as weight (if present)
            let reg = parts[0].toUpperCase().replace(/[-\s]/g, '');
            let type = parts[1] ? parts[1].toUpperCase() : '';
            let weight = parts[2] ? parts[2] : '';
            if (reg) {
                regToTypeWeight[reg] = { type, weight };
                // Add G- prefix and no prefix variants for UK regs
                if (reg.startsWith('G') && !reg.startsWith('G-')) {
                    regToTypeWeight['G-' + reg.substring(1)] = { type, weight };
                }
                if (reg.startsWith('G-')) {
                    regToTypeWeight[reg.replace('G-', 'G')] = { type, weight };
                }
                // Debug: Log each registration loaded
                if (reg.includes('OLEA')) {
                    console.log('Loaded reg:', reg, 'type:', type, 'weight:', weight);
                }
            }
        }
    });
    // Debug: Log all keys loaded
    console.log('All loaded aircraft regs:', Object.keys(regToTypeWeight).filter(k => k.includes('OLEA')));
    aircraftDbLoaded = true;
}
// Try new file, fallback to original
loadAircraftDb('assets/aircraft database/270326_with_weight.txt', 'assets/aircraft database/270326.txt');

// --- SIDEBAR LOGIC ---
document.getElementById('openSidebarBtn').onclick = function() {
    document.getElementById('lookupSidebar').classList.add('open');
};

document.getElementById('airlineInput').addEventListener('input', function() {
    const val = this.value.trim().toUpperCase();
    let result = '';
    if (val.length === 3 && trigraphToCallsign[val]) {
        result = `<b>Callsign:</b> ${trigraphToCallsign[val]}`;
    } else if (callsignToTrigraph[val]) {
        result = `<b>ICAO:</b> ${callsignToTrigraph[val]}`;
    } else {
        result = 'No match found.';
    }
    document.getElementById('airlineResult').innerHTML = result;
});

document.getElementById('airportInput').addEventListener('input', function() {
    if (!window.airportLookupReady) {
        document.getElementById('airportResult').innerHTML = '<em>Loading database...</em>';
        return;
    }
    if (!icaoToName || Object.keys(icaoToName).length === 0) {
        document.getElementById('airportResult').innerHTML = '<span style="color:red">Airport DB failed to load.</span>';
        return;
    }
    const val = this.value.trim().toUpperCase();
    let result = '';
    if (!val) {
        result = '';
    } else if (icaoToName[val]) {
        result = `<b>Name:</b> ${icaoToName[val]}`;
    } else {
        // Try partial match on name
        const matches = Object.entries(icaoToName).filter(([code, name]) => name.toUpperCase().includes(val));
        if (matches.length > 0) {
            result = matches.slice(0, 5).map(([code, name]) => `<b>${code}:</b> ${name}`).join('<br>');
        } else {
            result = 'No match found.';
        }
    }
    document.getElementById('airportResult').innerHTML = result;
});

// --- REGISTRATION INPUT LOGIC (ALWAYS ACTIVE) ---
document.getElementById('regInput').addEventListener('input', function() {
    // Remove spaces and hyphens for lookup
    let val = this.value.replace(/[-\s]/g, '').toUpperCase();
    let result = '';
    if (aircraftDbLoaded === 'error') {
        result = '<span style="color:red">Aircraft DB failed to load.</span>';
    } else if (!aircraftDbLoaded) {
        result = '<em>Loading database...</em>';
    } else if (val) {
        // Try all reasonable forms for UK regs
        let lookup = regToTypeWeight[val]
            || regToTypeWeight[val.replace(/^G-/, 'G')]
            || regToTypeWeight['G-' + val.replace(/^G-/, '')]
            || regToTypeWeight[val.replace(/^G/, 'G-')];
        // Debug: Log lookup attempts
        console.log('Lookup input:', this.value, 'normalized:', val);
        console.log('Tried keys:', val, val.replace(/^G-/, 'G'), 'G-' + val.replace(/^G-/, ''), val.replace(/^G/, 'G-'));
        if (lookup) {
            console.log('Lookup found:', lookup);
        } else {
            console.log('Lookup not found for:', val);
        }
        if (lookup) {
            const { type, weight } = lookup;
            result = `<b>ICAO Type:</b> ${type}` + (weight ? ` <span style='color:#888'>(MTOW: ${weight})</span>` : '');
        } else {
            result = 'No match found.';
        }
    } else {
        result = '';
    }
    document.getElementById('regResult').innerHTML = result;
});
