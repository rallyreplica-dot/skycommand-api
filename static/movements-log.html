<script>
// Helper: Parse CSV text into array of objects
function parseCSV(csv, delimiter = ',') {
    const lines = csv.split(/\r?\n/).filter(line => line.trim().length > 0);
    const headers = lines[0].split(delimiter).map(h => h.replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
        const values = [];
        let inQuotes = false, value = '', i = 0;
        while (i < line.length) {
            const char = line[i];
            if (char === '"') {
                if (inQuotes && line[i + 1] === '"') {
                    value += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === delimiter && !inQuotes) {
                values.push(value);
                value = '';
            } else {
                value += char;
            }
            i++;
        }
        values.push(value);
        const obj = {};
        headers.forEach((h, idx) => obj[h] = values[idx] !== undefined ? values[idx] : '');
        return obj;
    });
}

// Load airports.csv and build ICAO code to name map
let icaoToName = {};
fetch('assets/airports_europe_clean.csv')
    .then(resp => resp.text())
    .then(csv => {
        const airports = parseCSV(csv);
        // ICAO code is in 'ident' or 'icao_code' or 'gps_code' (use 'ident' for most cases)
        airports.forEach(ap => {
            // Only include airports in Europe (continent == 'EU')
            if (ap.continent && ap.continent.toUpperCase() === 'EU' && ap.name) {
                const codes = [ap.ident, ap.icao_code, ap.gps_code].map(x => (x||'').toUpperCase());
                codes.forEach(code => {
                    if (code) {
                        icaoToName[code] = ap.name;
                    }
                });
            }
        });
        window.airportLookupReady = true;
        renderMovementsLog();
    })
    .catch(() => {
        // If CSV fails to load, fallback to ICAO codes
        renderMovementsLog();
    });

// Render completed aerodrome movements and keep denied bookings independent.
let logSortKey = 'timestamp';
let logSortAsc = true;
let logFilter = '';
let movementRenderSequence = 0;
const aircraftTypeCache = new Map();
let aircraftTypeLookupPromise = null;

function normalizeAircraftRegistration(registration) {
    return String(registration || '').trim().toUpperCase().replace(/[-\s]/g, '');
}

async function ensureAircraftTypes(entries) {
    const registrations = new Map();
    entries.forEach(entry => {
        if (String(entry.type || '').trim()) return;
        const registration = String(entry.reg || entry.aircraftId || '').trim().toUpperCase();
        const key = normalizeAircraftRegistration(registration);
        if (key && !aircraftTypeCache.has(key)) registrations.set(key, registration);
    });

    if (registrations.size === 0) return;
    if (aircraftTypeLookupPromise) await aircraftTypeLookupPromise;

    const pendingRegistrations = new Map(
        [...registrations].filter(([key]) => !aircraftTypeCache.has(key))
    );
    if (pendingRegistrations.size === 0) return;

    const lookupPromise = (async () => {
        const response = await fetch('/api/aircraft-types', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ regs: [...pendingRegistrations.values()] })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const results = await response.json();
        if (!results || typeof results !== 'object' || Array.isArray(results)) {
            throw new Error('Expected an object of registration-to-type results');
        }

        const normalizedResults = new Map(
            Object.entries(results).map(([registration, type]) => [
                normalizeAircraftRegistration(registration),
                typeof type === 'string' && type.trim() ? type.trim() : null
            ])
        );
        pendingRegistrations.forEach((registration, key) => {
            if (!normalizedResults.has(key)) {
                throw new Error(`No aircraft type result returned for ${registration}`);
            }
            aircraftTypeCache.set(key, normalizedResults.get(key));
        });
    })();

    aircraftTypeLookupPromise = lookupPromise;
    try {
        await lookupPromise;
    } finally {
        if (aircraftTypeLookupPromise === lookupPromise) aircraftTypeLookupPromise = null;
    }
}

function displayAirport(value) {
    const code = String(value || '').trim().toUpperCase();
    const airportNameFallbacks = { EGSX: 'North Weald', EGTR: 'Elstree' };
    return icaoToName[code] || airportNameFallbacks[code] || String(value || '').trim();
}

function getMovementRoute(entry) {
    const route = String(entry.to || '').split(/\s*-\s*/).map(part => part.trim()).filter(Boolean);
    const origin = String(entry.from || '').trim() || (route.length > 1 ? route[0] : '');
    const destination = route.length > 1 ? route[route.length - 1] : (route[0] || '');
    return { origin: displayAirport(origin), destination: displayAirport(destination) };
}

function formatMovementTime(value) {
    const time = String(value || '').trim();
    return /^\d{4}$/.test(time) ? `${time.slice(0, 2)}:${time.slice(2)}` : time;
}

function formatMovementDate(timestamp) {
    const date = new Date(typeof timestamp === 'number' || /^\d+$/.test(String(timestamp)) ? Number(timestamp) : timestamp);
    if (Number.isNaN(date.getTime())) return '';
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function isCompletedAerodromeMovement(entry) {
    const category = String(entry.colorClass || '').toUpperCase();
    if (category === 'OVERFLIGHT' || category === 'TRANSIT') return false;
    return Boolean((entry.reg || entry.callsign) && (entry.atd || entry.ata));
}

async function renderDeniedBookings() {
    const container = document.getElementById('denied-bookings');
    if (!container) return;

    try {
        const response = await fetch('/api/flight-bookings');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const bookings = await response.json();
        if (!Array.isArray(bookings)) throw new Error('Expected an array of flight bookings');

        const denied = bookings.filter(booking => booking.status === 'denied');
        container.replaceChildren();
        if (denied.length === 0) {
            container.style.display = 'none';
            return;
        }

        container.style.display = '';
        const heading = document.createElement('span');
        heading.style.fontSize = '1.1em';
        heading.textContent = 'Denied Bookings:';
        container.appendChild(heading);

        denied.forEach(booking => {
            const entryBox = document.createElement('div');
            entryBox.style.margin = '8px 0';
            entryBox.style.padding = '8px';
            entryBox.style.background = '#fff0f0';
            entryBox.style.border = '1px solid #d32f2f';

            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.background = '#fff';
            table.style.marginBottom = '4px';
            table.style.borderCollapse = 'collapse';
            table.style.tableLayout = 'fixed';

            const headRow = document.createElement('tr');
            ['Registration', 'Callsign', 'Type', 'TO', 'ATD', 'ATA', 'FROM', 'Name', 'POB'].forEach(label => {
                const th = document.createElement('th');
                th.textContent = label;
                th.style.background = '#ffeaea';
                th.style.color = '#b71c1c';
                th.style.fontWeight = 'bold';
                th.style.padding = '4px 6px';
                th.style.border = '1px solid #ffd6d6';
                th.style.textAlign = 'left';
                headRow.appendChild(th);
            });
            const thead = document.createElement('thead');
            thead.appendChild(headRow);
            table.appendChild(thead);

            const row = document.createElement('tr');
            [booking.aircraftId || booking.reg || '', booking.callsign || '', booking.type || '', booking.to || '', booking.atd || '', booking.ata || '', booking.from || '', booking.name || '', booking.pob || ''].forEach(value => {
                const td = document.createElement('td');
                td.textContent = String(value);
                td.style.padding = '4px 6px';
                td.style.border = '1px solid #ffd6d6';
                td.style.background = '#fff';
                td.style.color = '#b71c1c';
                row.appendChild(td);
            });
            const tbody = document.createElement('tbody');
            tbody.appendChild(row);
            table.appendChild(tbody);
            entryBox.appendChild(table);

            const reapproveButton = document.createElement('button');
            reapproveButton.textContent = 'Reapprove';
            reapproveButton.onclick = async () => {
                if (!booking.id) {
                    alert('No booking ID');
                    return;
                }
                reapproveButton.disabled = true;
                reapproveButton.textContent = 'Reapproving...';
                try {
                    const response = await fetch(`/api/flight-bookings/${booking.id}/status`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'approved' })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
                    alert('Booking reapproved!');
                    await renderDeniedBookings();
                } catch (error) {
                    alert(`Request failed: ${error.message}`);
                } finally {
                    reapproveButton.disabled = false;
                    reapproveButton.textContent = 'Reapprove';
                }
            };
            entryBox.appendChild(reapproveButton);
            container.appendChild(entryBox);
        });
    } catch (error) {
        console.error('Failed to load denied bookings:', error);
        container.style.display = '';
        container.textContent = `Unable to load denied bookings: ${error.message}`;
    }
}

async function renderMovementsLog() {
    const tbody = document.getElementById('movementsLogBody');
    if (!tbody) return;
    const renderSequence = ++movementRenderSequence;
    tbody.replaceChildren();

    try {
        const response = await fetch('/api/movements');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const movements = await response.json();
        if (!Array.isArray(movements)) throw new Error('Expected an array of movements');
        if (renderSequence !== movementRenderSequence) return;

        let entries = movements.filter(isCompletedAerodromeMovement);
        let typeLookupFailed = false;
        try {
            await ensureAircraftTypes(entries);
        } catch (error) {
            console.error('Failed to look up aircraft types:', error);
            typeLookupFailed = true;
        }
        if (renderSequence !== movementRenderSequence) return;

        const selectedDate = document.getElementById('log-date').value;
        if (selectedDate) entries = entries.filter(entry => formatMovementDate(entry.timestamp) === selectedDate);

        if (logFilter) {
            const filter = logFilter.toUpperCase();
            const categories = { DEPARTURES: 'LANDAWAY', ARRIVALS: 'ARRIVAL', LOCAL: 'LOCAL', CIRCUITS: 'CIRCUIT' };
            if (categories[filter]) {
                entries = entries.filter(entry => String(entry.colorClass || '').toUpperCase() === categories[filter]);
            }
        }

        entries.sort((a, b) => {
            const aValue = a[logSortKey] ?? '';
            const bValue = b[logSortKey] ?? '';
            let comparison;
            if (logSortKey === 'timestamp') {
                comparison = Number(aValue) - Number(bValue);
            } else {
                comparison = String(aValue).toUpperCase().localeCompare(String(bValue).toUpperCase());
            }
            return logSortAsc ? comparison : -comparison;
        });

        entries.forEach(entry => {
            const route = getMovementRoute(entry);
            const registration = String(entry.reg || entry.aircraftId || '').trim().toUpperCase();
            const displayedRegistration = /^G[A-Z0-9]{4}$/.test(registration) ? `G-${registration.slice(1)}` : registration;
            const registrationKey = normalizeAircraftRegistration(registration);
            const aircraftType = String(entry.type || '').trim()
                || aircraftTypeCache.get(registrationKey)
                || (typeLookupFailed && registrationKey ? 'Lookup failed' : '');
            const row = document.createElement('tr');
            const category = String(entry.colorClass || '').toLowerCase();
            if (['landaway', 'circuit', 'local', 'arrival'].includes(category)) row.classList.add(category);

            [displayedRegistration, entry.callsign, aircraftType, route.destination, formatMovementTime(entry.atd), formatMovementTime(entry.ata), route.origin, entry.name, entry.pob].forEach(value => {
                const cell = document.createElement('td');
                cell.textContent = String(value || '').replace(/\s+/g, ' ').trim();
                row.appendChild(cell);
            });
            tbody.appendChild(row);
        });
    } catch (error) {
        if (renderSequence !== movementRenderSequence) return;
        console.error('Failed to load movements:', error);
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 9;
        cell.textContent = `Unable to load movements: ${error.message}`;
        row.appendChild(cell);
        tbody.appendChild(row);
    }
}

// Sorting and filters
['sort-reg', 'sort-atd', 'sort-ata'].forEach(id => {
    document.getElementById(id).onclick = () => {
        logSortKey = id === 'sort-reg' ? 'reg' : id === 'sort-atd' ? 'atd' : 'ata';
        logSortAsc = !logSortAsc;
        renderMovementsLog();
    };
});

document.getElementById('showOnlyDropdown').addEventListener('change', function() {
    logFilter = this.value.trim();
    renderMovementsLog();
});
document.getElementById('log-date').addEventListener('change', renderMovementsLog);

renderDeniedBookings();// --- AIRLINE LOOKUP ---
let trigraphToCallsign = {};
let callsignToTrigraph = {};
fetch('assets/data/airlines.dat.txt')
    .then(resp => resp.text())
    .then(txt => {
        // Use robust CSV parser for airline data
        const lines = txt.split(/\r?\n/).filter(line => line.trim().length > 0 && !line.startsWith('#'));
        const airlineRows = lines.map(line => {
            const values = [];
            let inQuotes = false, value = '', i = 0;
            while (i < line.length) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        value += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    values.push(value);
                    value = '';
                } else {
                    value += char;
                }
                i++;
            }
            values.push(value);
            return values;
        });
        airlineRows.forEach(parts => {
            if (parts.length < 7) return;
            let icao = parts[4]?.replace(/(^"|"$)/g, '');
            let callsign = parts[5]?.replace(/(^"|"$)/g, '');
            if (icao && callsign) {
                trigraphToCallsign[icao.toUpperCase()] = callsign;
                callsignToTrigraph[callsign.toUpperCase()] = icao;
            }
        });
    });

// --- AIRCRAFT REGISTRATION LOOKUP (LOAD ON PAGE LOAD) ---
let regToType = {};
let aircraftDbLoaded = false;
let regToTypeWeight = {};
function loadAircraftDb(primary, fallback) {
    fetch(primary)
        .then(resp => {
            if (!resp.ok) throw new Error('Primary not found');
            return resp.text();
        })
        .then(parseAircraftDb)
        .catch(() => {
            if (fallback) {
                fetch(fallback)
                    .then(resp => resp.text())
                    .then(parseAircraftDb)
                    .catch(() => {
                        aircraftDbLoaded = 'error';
                    });
            } else {
                aircraftDbLoaded = 'error';
            }
        });
}
function parseAircraftDb(txt) {
    txt.split(/\r?\n/).forEach(line => {
        let parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
            // Always use first field as reg, second as type, third as weight (if present)
            let reg = parts[0].toUpperCase().replace(/[-\s]/g, '');
            let type = parts[1] ? parts[1].toUpperCase() : '';
            let weight = parts[2] ? parts[2] : '';
            if (reg) {
                regToTypeWeight[reg] = { type, weight };
                // Add G- prefix and no prefix variants for UK regs
                if (reg.startsWith('G') && !reg.startsWith('G-')) {
                    regToTypeWeight['G-' + reg.substring(1)] = { type, weight };
                }
                if (reg.startsWith('G-')) {
                    regToTypeWeight[reg.replace('G-', 'G')] = { type, weight };
                }
                // Debug: Log each registration loaded
                if (reg.includes('OLEA')) {
                    console.log('Loaded reg:', reg, 'type:', type, 'weight:', weight);
                }
            }
        }
    });
    // Debug: Log all keys loaded
    console.log('All loaded aircraft regs:', Object.keys(regToTypeWeight).filter(k => k.includes('OLEA')));
    aircraftDbLoaded = true;
}
// Try new file, fallback to original
loadAircraftDb('assets/aircraft database/270326_with_weight.txt', 'assets/aircraft database/270326.txt');

// --- SIDEBAR LOGIC ---
document.getElementById('openSidebarBtn').onclick = function() {
    document.getElementById('lookupSidebar').classList.add('open');
};

document.getElementById('airlineInput').addEventListener('input', function() {
    const val = this.value.trim().toUpperCase();
    let result = '';
    if (val.length === 3 && trigraphToCallsign[val]) {
        result = `<b>Callsign:</b> ${trigraphToCallsign[val]}`;
    } else if (callsignToTrigraph[val]) {
        result = `<b>ICAO:</b> ${callsignToTrigraph[val]}`;
    } else {
        result = 'No match found.';
    }
    document.getElementById('airlineResult').innerHTML = result;
});

document.getElementById('airportInput').addEventListener('input', function() {
    if (!window.airportLookupReady) {
        document.getElementById('airportResult').innerHTML = '<em>Loading database...</em>';
        return;
    }
    if (!icaoToName || Object.keys(icaoToName).length === 0) {
        document.getElementById('airportResult').innerHTML = '<span style="color:red">Airport DB failed to load.</span>';
        return;
    }
    const val = this.value.trim().toUpperCase();
    let result = '';
    if (!val) {
        result = '';
    } else if (icaoToName[val]) {
        result = `<b>Name:</b> ${icaoToName[val]}`;
    } else {
        // Try partial match on name
        const matches = Object.entries(icaoToName).filter(([code, name]) => name.toUpperCase().includes(val));
        if (matches.length > 0) {
            result = matches.slice(0, 5).map(([code, name]) => `<b>${code}:</b> ${name}`).join('<br>');
        } else {
            result = 'No match found.';
        }
    }
    document.getElementById('airportResult').innerHTML = result;
});

// --- REGISTRATION INPUT LOGIC (ALWAYS ACTIVE) ---
document.getElementById('regInput').addEventListener('input', async function() {
    const reg = this.value.trim().toUpperCase();
    const resultEl = document.getElementById('regResult');

    if (!reg) {
        resultEl.textContent = '';
        return;
    }

    try {
        const response = await fetch(
            `/api/aircraft-type/${encodeURIComponent(reg)}`
        );

        if (!response.ok) throw new Error('Lookup failed');

        const data = await response.json();

        if (this.value.trim().toUpperCase() !== reg) return;

        resultEl.textContent = data.type
            ? `ICAO Type: ${data.type}`
            : 'No match found.';

    } catch (error) {
        if (this.value.trim().toUpperCase() === reg) {
            resultEl.textContent = 'Aircraft lookup unavailable.';
        }
    }
});
</script>
