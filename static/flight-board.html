    <script>
// --- LOAD BOOKINGS FROM API AND CREATE FLIGHT STRIPS ---
document.addEventListener('DOMContentLoaded', function() {
    fetch('https://skycommand-api.onrender.com/api/flight-bookings')
        .then(resp => resp.json())
        .then(bookings => {
            // Get today's date in YYYY-MM-DD format
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            bookings.forEach(booking => {
                // Map backend fields to frontend expected fields
                let reg = booking.aircraft || booking.aircraftId || booking.reg || '';
                let posn = booking.posn || '';
                let from = booking.from || booking.departure || booking.departureAirport || '';
                let to = booking.to || booking.arrival || booking.arrivalAirport || '';
                let height = booking.height || '';
                let heading = booking.heading || '';
                let pob = booking.pob || booking.passengers || '';
                let status = booking.status || 'pending';
                let bookingId = booking.id;
                let type = booking.type || booking.remarks || '';
                // Use plannedDepartureTime for date filtering
                let plannedDeparture = booking.plannedDepartureTime || '';
                let date = '';
                if (plannedDeparture) {
                    // plannedDepartureTime is ISO string, get YYYY-MM-DD
                    date = plannedDeparture.split('T')[0];
                }
                if (date === todayStr) {
                    let {strip, laneSelector} = createFlightStrip({reg, posn, from, to, height, heading, pob, status, bookingId});
                    // Set type if available
                    if (type) {
                        strip.querySelector('.aircraft-type').textContent = type;
                    }
                    // Place in correct lane
                    let lane = document.querySelector(laneSelector);
                    if (!lane) {
                        lane = document.querySelector('.lane');
                    }
                    let container = lane.querySelector('#flight-strip-container');
                    if (!container) {
                        container = document.createElement('div');
                        container.id = 'flight-strip-container';
                        const label = lane.querySelector('.lane-label');
                        if (label && label.nextSibling) {
                            lane.insertBefore(container, label.nextSibling);
                        } else {
                            lane.appendChild(container);
                        }
                    }
                    container.appendChild(strip);
                    // Add pulse and approve/deny if pending
                    if (strip._shouldPulse) {
                        strip.classList.add('pending-pulse');
                        strip._addApproveDeny();
                    }
                }
            });
        })
        .catch(err => {
            console.error('Failed to load bookings from API:', err);
        });
});
// --- AIRCRAFT TYPE LOOKUP ---
let regToType = {};
fetch('assets/aircraft%20database/270326_with_weight.txt')
    .then(resp => resp.text())
    .then(txt => {
        txt.split(/\r?\n/).forEach(line => {
            // Format: REG [spaces] TYPE [spaces] (optional weight)
            const match = line.match(/^(\S+)\s+(\S{3,5})/);
            if (match) {
                regToType[match[1].toUpperCase()] = match[2].toUpperCase();
            }
        });
    });
// --- AIRPORTS CSV LOADING FOR NAME→ICAO LOOKUP ---
let nameToIcao = {};
let icaoSet = new Set();
function parseCSV(csv, delimiter = ',') {
    const lines = csv.split(/\r?\n/).filter(Boolean);
    const headers = lines[0].split(delimiter).map(h => h.replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
        // Handle quoted fields with commas
        const regex = /("[^"]*(?:""[^"]*)*"|[^"'+delimiter+']+)/g;
        const values = [];
        let match;
        let re = new RegExp(regex.source.replace(/\+delimiter\+/g, delimiter), 'g');
        while ((match = re.exec(line)) !== null) {
            let val = match[0];
            if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
            values.push(val);
        }
        if (values.length !== headers.length) return null;
        const obj = {};
        headers.forEach((h, i) => obj[h] = values[i]);
        return obj;
    }).filter(Boolean);
}
fetch('assets/airports.csv')
    .then(resp => resp.text())
    .then(csv => {
        const airports = parseCSV(csv);
        airports.forEach(ap => {
            // ICAO code is in 'ident' or 'icao_code' or 'gps_code'
            if (ap.ident) icaoSet.add(ap.ident.toUpperCase());
            if (ap.icao_code) icaoSet.add(ap.icao_code.toUpperCase());
            if (ap.gps_code) icaoSet.add(ap.gps_code.toUpperCase());
            // Map name to ICAO (prefer ident)
            if (ap.name && ap.ident) nameToIcao[ap.name.trim().toUpperCase()] = ap.ident.toUpperCase();
        });
    });

// Function to prepopulate flight strip fields from a booking object
function populateFlightStripFromBooking(booking) {
    // ETD and ETA
    document.getElementById('etdTime').textContent = booking.etd || 'ETD';
    document.getElementById('etaTime').textContent = booking.eta || 'ETA';
    // Registration, Type, Callsign
    document.getElementById('regBox').textContent = booking.registration || '';
    document.querySelector('.aircraft-type').textContent = booking.type || '';
    document.getElementById('callsignBox').textContent = booking.callsign || '';
    document.querySelector('.aircraft-icao-speech').textContent = booking.icaoSpeech ? '"' + booking.icaoSpeech + '"' : '';
    // Route and category logic
    const BASE = 'EGSX';
    let route = (booking.route || '').toUpperCase();
    let routeBox = document.getElementById('routeBox');
    let strip = document.getElementById('flightStrip1');
    strip.classList.remove('landaway', 'circuit', 'local', 'arrival', 'overflight');
    // Circuit
    if (booking.category && booking.category.toLowerCase() === 'circuit') {
        strip.classList.add('circuit');
        routeBox.textContent = 'C';
    }
    // Local
    else if (booking.category && booking.category.toLowerCase() === 'local') {
        strip.classList.add('local');
        routeBox.textContent = 'L';
    }
    // Landaway (base departure)
    else if (route.startsWith(BASE + '-') || route.startsWith(BASE + ' ')) {
        strip.classList.add('landaway');
        routeBox.textContent = route.substring(0, 9);
    }
    // Arrival
    else if (route.endsWith('-' + BASE) || route.endsWith(' ' + BASE)) {
        strip.classList.add('arrival');
        routeBox.textContent = route.substring(0, 9);
    }
    // Overflight
    else {
        strip.classList.add('overflight');
        routeBox.textContent = route.substring(0, 9);
    }
    document.querySelector('.final-pob').textContent = 'POB';
    document.getElementById('bookingBox').textContent = booking.pob || '';
}

    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
}

// Drag and drop for all strips (existing and future)
function setupDragAndDropForStrips() {
    document.querySelectorAll('.flight-strip').forEach(strip => {
        if (!strip.hasAttribute('draggable')) strip.draggable = true;
        if (!strip.id) strip.id = 'flightStrip-' + Math.random().toString(36).substr(2, 9);
        if (!strip._dragEventsAttached) {
            strip.addEventListener('dragstart', function(e) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', strip.id);
                setTimeout(() => strip.classList.add('dragging'), 0);
            });
            strip.addEventListener('dragend', function() {
                strip.classList.remove('dragging');
            });
            strip._dragEventsAttached = true;
        }
    });
}
setupDragAndDropForStrips();
const observer = new MutationObserver(setupDragAndDropForStrips);
observer.observe(document.body, {childList: true, subtree: true});
document.querySelectorAll('.droppable').forEach(dropTarget => {
    dropTarget.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropTarget.classList.add('drag-over');
    });
    dropTarget.addEventListener('dragleave', function() {
        dropTarget.classList.remove('drag-over');
    });
    dropTarget.addEventListener('drop', function(e) {
        e.preventDefault();
        dropTarget.classList.remove('drag-over');
        const stripId = e.dataTransfer.getData('text/plain');
        const stripElem = document.getElementById(stripId);
        if (!stripElem) return;
        // If dropped in Completed lane, log and remove
        if (dropTarget.classList.contains('lane-booked-out-bottom')) {
            // Extract details from strip
            const reg = stripElem.querySelector('.aircraft-reg')?.textContent || '';
            const type = stripElem.querySelector('.aircraft-type')?.textContent || '';
            let to = stripElem.querySelector('.strip-route-box .route-content')?.textContent || '';
            const atd = stripElem.querySelector('input[placeholder="ATD"]')?.value || '';
            const ata = stripElem.querySelector('input[placeholder="ATA"]')?.value || '';
            let from = (function() {
                const route = stripElem.querySelector('.strip-route-box .route-content')?.textContent || '';
                if (route.includes('-')) return route.split('-')[0];
                return '';
            })();
            // Replace L/C with Local/Circuit for log
            if (to === 'L') to = 'Local';
            if (to === 'C') to = 'Circuit';
            if (from === 'L') from = 'Local';
            if (from === 'C') from = 'Circuit';
            // Replace ICAO with airfield name if available
            function icaoToName(icao) {
                if (!icao) return icao;
                icao = icao.trim().toUpperCase();
                // Find matching airport name from airports.csv loaded into icaoSet and nameToIcao
                // We need a reverse lookup: ICAO code to name
                if (window.icaoToNameMap && window.icaoToNameMap[icao]) return window.icaoToNameMap[icao];
                // Fallback: try to build the map if not present
                if (window.nameToIcao) {
                    for (const [name, code] of Object.entries(window.nameToIcao)) {
                        if (code === icao) {
                            if (!window.icaoToNameMap) window.icaoToNameMap = {};
                            window.icaoToNameMap[icao] = name;
                            return name;
                        }
                    }
                }
                return icao;
            }
            to = icaoToName(to);
            from = icaoToName(from);
            const name = stripElem.querySelector('.strip-notes')?.value || '';
            const pob = stripElem.querySelector('.final-booking')?.textContent || '';
            // Get color class
            const colorClass = Array.from(stripElem.classList).find(cls => ['landaway','circuit','local','arrival','overflight'].includes(cls)) || '';
            // Save to localStorage
            const logEntry = { reg, type, to, atd, ata, from, name, pob, colorClass, timestamp: Date.now() };
            let log = [];
            try { log = JSON.parse(localStorage.getItem('movementsLog') || '[]'); } catch {}
            log.push(logEntry);
            localStorage.setItem('movementsLog', JSON.stringify(log));
            console.log('[FlightBoard] Added to movementsLog:', logEntry);
            // Remove strip from DOM
            stripElem.remove();
            return;
        }
        // Default: move strip as before
        if (
            dropTarget.classList.contains('lane-booked-out-top') ||
            dropTarget.classList.contains('lane-booked-out-bottom') ||
            dropTarget.classList.contains('lane-half') ||
            dropTarget.classList.contains('lane-circuit-top') ||
            dropTarget.classList.contains('lane-circuit-bottom')
        ) {
            let container = dropTarget.querySelector('#flight-strip-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'flight-strip-container';
                dropTarget.appendChild(container);
            }
            container.appendChild(stripElem);
        } else {
            let lane = dropTarget.closest('.lane');
            let container = lane.querySelector('#flight-strip-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'flight-strip-container';
                lane.querySelector('.lane-label')?.after(container);
            }
            container.appendChild(stripElem);
        }
    });
});

// Custom submit logic for new strips
// Accepts an optional status argument
function createFlightStrip({reg, posn, from, to, height, heading, pob, status, bookingId}) {
    const BASE = 'EGSX';
    let category = '';
    const strip = document.createElement('div');
    let laneSelector = '';
    let regOrCallsign = (reg || '').toUpperCase();
    let route = (from + '-' + to).toUpperCase();
    // ICAO to name utility (same as in log patch)
    function icaoToName(icao) {
        if (!icao) return icao;
        icao = icao.trim().toUpperCase();
        if (window.icaoToNameMap && window.icaoToNameMap[icao]) return window.icaoToNameMap[icao];
        if (window.nameToIcao) {
            for (const [name, code] of Object.entries(window.nameToIcao)) {
                if (code === icao) {
                    if (!window.icaoToNameMap) window.icaoToNameMap = {};
                    window.icaoToNameMap[icao] = name;
                    return name;
                }
            }
        }
        return icao;
    }
    let heightUC = (height || '').toUpperCase();
    let headingUC = (heading || '').toUpperCase();
    const fromUpper = (from || '').toUpperCase();
    const toUpper = (to || '').toUpperCase();
    let routeBoxHTML = '';
    if (fromUpper === BASE && toUpper === BASE) {
        category = 'local';
        laneSelector = '.lane-local';
        routeBoxHTML = `<div class="route-content" style="font-size:2.2em;font-weight:bold;display:flex;align-items:center;justify-content:center;height:100%;">L</div>`;
    } else if (fromUpper === BASE || toUpper === BASE) {
        category = fromUpper === BASE ? 'landaway' : 'arrival';
        laneSelector = fromUpper === BASE ? '.lane-booked-out-top' : '.lane-booked-in';
        // Show airfield names if available
        let fromDisplay = fromUpper === BASE ? 'EGSX' : icaoToName(fromUpper);
        let toDisplay = toUpper === BASE ? 'EGSX' : icaoToName(toUpper);
        routeBoxHTML = `<div class="route-content" style="flex-direction:column;justify-content:space-between;height:100%;display:flex;">
            <div style="font-size:0.8em;font-weight:600;text-align:center;padding-top:2px;">
                ${heightUC ? 'HT: ' + heightUC : ''} ${headingUC ? 'HDG: ' + headingUC : ''}
            </div>
            <div style="font-size:1.1em;text-align:center;margin-top:auto;padding-bottom:2px;">${fromDisplay} - ${toDisplay}</div>
        </div>`;
    } else {
        // If neither from nor to is EGSX, treat as overflight but place in local swim lane
        category = 'overflight';
        laneSelector = '.lane-local';
        let fromDisplay = icaoToName(fromUpper);
        let toDisplay = icaoToName(toUpper);
        routeBoxHTML = `<div class=\"route-content\" style=\"flex-direction:column;justify-content:space-between;height:100%;display:flex;\">\n            <div style=\"font-size:0.8em;font-weight:600;text-align:center;padding-top:2px;\">\n                ${height ? 'HT: ' + height : ''} ${heading ? 'HDG: ' + heading : ''}\n            </div>\n            <div style=\"font-size:1.1em;text-align:center;margin-top:auto;padding-bottom:2px;\">${fromDisplay} - ${toDisplay}</div>\n        </div>`;
    }
    strip.className = 'flight-strip ' + category;
    // Only add pulse/approve/deny for remote bookings (not manual), not for overflight (green)
    let shouldPulse = (!status || status === 'pending') && category !== 'overflight';
    strip._shouldPulse = shouldPulse;
    strip.draggable = true;
    // Set bookingId as data attribute if provided
    if (bookingId) {
        strip.dataset.bookingId = bookingId;
    }
    strip.innerHTML = [
        '<div class="strip-main">',
            '<div class="strip-row strip-times">',
                '<div class="strip-quarter-box">',
                    '<div class="quarter top-left"><span>ETD</span></div>',
                    '<div class="quarter top-right"><span>ETA</span></div>',
                     '<div class="quarter bottom-left"><input type="text" placeholder="ATD" title="Double-click to set current time" style="width: 48px; font-size: 1.1em; text-align: center;"></div>',
                     '<div class="quarter bottom-right"><input type="text" placeholder="ATA" title="Double-click to set current time" style="width: 48px; font-size: 1.1em; text-align: center;"></div>',
                '</div>',
                '<div class="strip-aircraft-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">',
                    `<div class="aircraft-reg" style="font-size: 1.2em; font-weight: bold; text-align: center; width: 100%;">${regOrCallsign}</div>`,
                    '<div class="aircraft-type"></div>',
                '</div>',
                '<div class="strip-route-box">',
                    routeBoxHTML,
                '</div>',
                '<div class="strip-final-box">',
                    '<div class="final-row">',
                        '<div class="final-rwy">RWY</div>',
                        '<div class="final-tick"><input type="checkbox"><label class="tick-label"></label></div>',
                    '</div>',
                    '<div class="final-row">',
                        '<div class="final-press">Press</div>',
                        '<div class="final-tick"><input type="checkbox"><label class="tick-label"></label></div>',
                    '</div>',
                    '<div class="final-row">',
                        '<div class="final-pob">POB</div>',
                        `<div class="final-booking">${(pob || '').toUpperCase()}</div>`,
                    '</div>',
                '</div>',
            '</div>',
        '</div>',
        // Hidden expandable section
        '<div class="strip-extra" style="display:none; padding:6px 2px 2px 2px; background:#f7f7f7; border-top:1px solid #ccc;">',
            '<div><label>Name:</label> <input type="text" class="strip-notes" style="width:70%"></div>',
            '<div style="margin-top:6px;display:flex;gap:18px;align-items:center;">',
                '<label><input type="checkbox" class="strip-fuel"> Fuel</label>',
                '<label><input type="checkbox" class="strip-lights"> Lights</label>',
                '<label><input type="checkbox" class="strip-ifr"> IFR</label>',
            '</div>',
        '</div>'
    ].join('');

    // Add double-click handler for ATD/ATA inputs in this strip, and restrict based on strip color
    const atdInput = strip.querySelector('input[placeholder="ATD"]');
    const ataInput = strip.querySelector('input[placeholder="ATA"]');
    function getCurrentTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }
    // Restrict input based on strip color
    if (strip.classList.contains('arrival')) {
        // Yellow: only ATA enabled
        if (atdInput) {
            atdInput.disabled = true;
            atdInput.style.background = '#eee';
        }
        if (ataInput) {
            ataInput.disabled = false;
            ataInput.style.background = '';
            ataInput.addEventListener('dblclick', function() {
                ataInput.value = getCurrentTime();
            });
        }
    } else if (strip.classList.contains('landaway')) {
        // Blue: only ATD enabled
        if (ataInput) {
            ataInput.disabled = true;
            ataInput.style.background = '#eee';
        }
        if (atdInput) {
            atdInput.disabled = false;
            atdInput.style.background = '';
            atdInput.addEventListener('dblclick', function() {
                atdInput.value = getCurrentTime();
            });
        }
    } else {
        // All others: both enabled
        if (atdInput) {
            atdInput.disabled = false;
            atdInput.style.background = '';
            atdInput.addEventListener('dblclick', function() {
                atdInput.value = getCurrentTime();
            });
        }
        if (ataInput) {
            ataInput.disabled = false;
            ataInput.style.background = '';
            ataInput.addEventListener('dblclick', function() {
                ataInput.value = getCurrentTime();
            });
        }
    }

    // Only for remote bookings: add approve/deny buttons
    strip._addApproveDeny = function() {
        const actionDiv = document.createElement('div');
        actionDiv.style.display = 'flex';
        actionDiv.style.justifyContent = 'center';
        actionDiv.style.gap = '16px';
        actionDiv.style.margin = '8px 0 0 0';
        // Approve button
        const approveBtn = document.createElement('button');
        approveBtn.textContent = 'Approve';
        approveBtn.style.background = '#43a047';
        approveBtn.style.color = '#fff';
        approveBtn.style.fontWeight = 'bold';
        approveBtn.style.border = 'none';
        approveBtn.style.borderRadius = '4px';
        approveBtn.style.padding = '4px 16px';
        approveBtn.style.cursor = 'pointer';
        // Deny button
        const denyBtn = document.createElement('button');
        denyBtn.textContent = 'Deny';
        denyBtn.style.background = '#d32f2f';
        denyBtn.style.color = '#fff';
        denyBtn.style.fontWeight = 'bold';
        denyBtn.style.border = 'none';
        denyBtn.style.borderRadius = '4px';
        denyBtn.style.padding = '4px 16px';
        denyBtn.style.cursor = 'pointer';
        actionDiv.appendChild(approveBtn);
        actionDiv.appendChild(denyBtn);
        strip.appendChild(actionDiv);

        // Approve handler
        approveBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            // Send PATCH to backend to update status to 'approved'
            if (strip.dataset.bookingId) {
                fetch(`/bookings/${strip.dataset.bookingId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'approved' })
                })
                .then(response => response.json())
                .then(data => {
                    strip.classList.remove('pending-pulse');
                    strip.style.boxShadow = '';
                    actionDiv.remove();
                    // Optionally update UI to show approved status
                    strip.classList.add('approved');
                })
                .catch(err => {
                    alert('Failed to approve booking.');
                });
            }
            else {
                alert('Booking ID not found.');
            }
        });
        // Deny handler
        denyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            // Send PATCH to backend to update status to 'denied'
            if (strip.dataset.bookingId) {
                fetch(`/bookings/${strip.dataset.bookingId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'denied' })
                })
                .then(response => response.json())
                .then(data => {
                    strip.classList.remove('pending-pulse');
                    strip.style.boxShadow = '';
                    actionDiv.remove();
                    // Optionally update UI to show denied status
                    strip.classList.add('denied');
                })
                .catch(err => {
                    alert('Failed to deny booking.');
                });
            }
            else {
                alert('Booking ID not found.');
            }
        });
    }

    // Toggle expand/collapse on click
    strip.addEventListener('click', function(e) {
        // Only toggle if not clicking on an input, textarea, label, or button
        if (['INPUT', 'TEXTAREA', 'LABEL', 'BUTTON'].includes(e.target.tagName)) return;
        const extra = strip.querySelector('.strip-extra');
        if (extra) {
            if (extra.style.display === 'none') {
                extra.style.display = 'block';
            } else {
                extra.style.display = 'none';
            }
        }
    });
    strip.addEventListener('dragstart', function(e) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', strip.id || 'newstrip');
        setTimeout(() => strip.classList.add('dragging'), 0);
    });
    strip.addEventListener('dragend', function() {
        strip.classList.remove('dragging');
    });
    if (!strip.id) {
        strip.id = 'flightStrip-' + Math.random().toString(36).substr(2, 9);
    }
    // Fallback: if selector doesn't match, use first swim lane
    let lane = document.querySelector(laneSelector);
    if (!lane) {
        lane = document.querySelector('.lane');
        laneSelector = '.lane';
    }
    return {strip, laneSelector};
}


// --- Auto-fill type on reg input ---
document.getElementById('regInput').addEventListener('blur', autoFillType);
document.getElementById('regInput').addEventListener('change', autoFillType);
document.getElementById('regInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') autoFillType();
});

function autoFillType() {
    const reg = document.getElementById('regInput').value.trim().toUpperCase();
    const type = regToType[reg] || '';
    // Find the preview strip if it exists, else do nothing
    // Or, if you want to show it in a preview area, you could set a field
    // For now, just set a hidden field or a global for use on submit
    window._autoType = type;
    // Optionally, show type in a preview area or next to reg input
    let typePreview = document.getElementById('typePreview');
    if (!typePreview) {
        typePreview = document.createElement('span');
        typePreview.id = 'typePreview';
        typePreview.style.marginLeft = '8px';
        typePreview.style.fontWeight = 'bold';
        document.getElementById('regInput').parentNode.appendChild(typePreview);
    }
    typePreview.textContent = type ? `Type: ${type}` : '';
}

document.getElementById('submitBtn').addEventListener('click', function() {
    console.log('Submit handler fired');
    const reg = document.getElementById('regInput').value;
    const posn = document.getElementById('posnInput').value;
    let from = document.getElementById('fromInput').value;
    let to = document.getElementById('toInput').value;
    const height = document.getElementById('heightInput').value;
    const heading = document.getElementById('headingInput').value;
    const pob = document.getElementById('pobInput').value;
    // --- Convert airport name to ICAO if needed ---
    function isIcaoCode(val) {
        return val && icaoSet.has(val.trim().toUpperCase());
    }
    if (from && !isIcaoCode(from)) {
        const lookup = nameToIcao[from.trim().toUpperCase()];
        if (lookup) from = lookup;
    }
    if (to && !isIcaoCode(to)) {
        const lookup = nameToIcao[to.trim().toUpperCase()];
        if (lookup) to = lookup;
    }
    // Use auto-filled type if available
    let type = window._autoType || '';
    let {strip, laneSelector} = createFlightStrip({reg, posn, from, to, height, heading, pob});
    // Set the type field on the strip
    if (type) {
        strip.querySelector('.aircraft-type').textContent = type;
    }
    if (to && to.trim().toUpperCase() === 'EGSX') {
        laneSelector = '.lane-local';
    }
    strip.setAttribute('data-manual', 'true');
    strip.classList.remove('pending-pulse');
    let lane = document.querySelector(laneSelector);
    if (!lane) {
        alert('No valid swim lane found for this strip.');
        return;
    }
    let container = lane.querySelector('#flight-strip-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'flight-strip-container';
        const label = lane.querySelector('.lane-label');
        if (label && label.nextSibling) {
            lane.insertBefore(container, label.nextSibling);
        } else {
            lane.appendChild(container);
        }
    }
    container.insertBefore(strip, container.firstChild);
    if (!strip.hasAttribute('data-manual')) {
        if (strip._shouldPulse) strip.classList.add('pending-pulse');
        if (strip._shouldPulse) strip._addApproveDeny();
    }
    const isTimeOrderedLane = laneSelector === '.lane-booked-out-top' || laneSelector === '.lane-booked-in';
    if (isTimeOrderedLane) {
        const manualStrips = Array.from(container.children).filter(child => child.classList && child.classList.contains('flight-strip') && child.getAttribute('data-manual') === 'true');
        const nonManualStrips = Array.from(container.children).filter(child => child.classList && child.classList.contains('flight-strip') && child.getAttribute('data-manual') !== 'true');
        function getTimeValue(stripElem) {
            const atdInput = stripElem.querySelector('input[placeholder="ATD"]');
            const etdSpan = stripElem.querySelector('.quarter.top-left span');
            let timeStr = atdInput && atdInput.value ? atdInput.value : (etdSpan ? etdSpan.textContent : '');
            if (/^\d{1,2}:\d{2}$/.test(timeStr)) {
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            }
            return 24 * 60;
        }
        nonManualStrips.sort((a, b) => getTimeValue(a) - getTimeValue(b));
        [...container.children].forEach(child => {
            if (child.classList && child.classList.contains('flight-strip')) container.removeChild(child);
        });
        manualStrips.forEach(strip => container.appendChild(strip));
        nonManualStrips.forEach(strip => container.appendChild(strip));
    }
    setupDragAndDropForStrips();
    console.log('Created strip for lane:', laneSelector, 'with reg:', reg);
    document.getElementById('regInput').value = '';
    document.getElementById('posnInput').value = '';
    document.getElementById('fromInput').value = '';
    document.getElementById('toInput').value = '';
    document.getElementById('heightInput').value = '';
    document.getElementById('headingInput').value = '';
    document.getElementById('pobInput').value = '';
    // Clear preview
    let typePreview = document.getElementById('typePreview');
    if (typePreview) typePreview.textContent = '';
    window._autoType = '';
});
